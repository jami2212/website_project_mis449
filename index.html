<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenWork - Task-Based Work Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <h1>ZenWork Manager</h1>

    <!-- Burnout Monitor Banner -->
    <div class="burnout-banner" id="burnout-banner">
        <div class="burnout-header">
            <span>Burnout Risk Monitor</span>
            <span id="burnout-status" class="status-low">Low Risk</span>
        </div>
        <p id="burnout-msg">Select a task and start working. Remember to take regular breaks!</p>
        <button class="break-btn" onclick="takeBreak()">Take Break Now</button>
    </div>

    <!-- Daily Productivity & Work Dashboard -->
    <div class="metrics-section">
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-value" id="total-time">0m</span>
                <span class="metric-label">Total Time Worked</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="efficiency-rate">0%</span>
                <span class="metric-label">Efficiency Rate</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="completed-count">0/0</span>
                <span class="metric-label">Tasks Done</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="break-count">0</span>
                <span class="metric-label">Breaks Taken</span>
            </div>
        </div>
    </div>

    <!-- Task Input Section -->
    <div class="task-input-card">
        <input type="text" id="taskInput" placeholder="Enter task name...">
        <input type="number" id="taskEstimate" placeholder="Est. min" min="1">
        <button onclick="addTask()">Add Task</button>
    </div>

    <!-- Individual Task List -->
    <div class="task-section">
        <h3>Tasks</h3>
        <ul id="taskList"></ul>
    </div>

    <!-- Daily History Log -->
    <div class="history-section">
        <h3>History <span class="history-sub">(last 7 days)</span></h3>
        <ul id="historyList"></ul>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
